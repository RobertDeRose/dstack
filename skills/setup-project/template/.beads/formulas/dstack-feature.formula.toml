formula = "dstack-feature"
description = "Documentation-first feature workflow with interactive design, direct specification reviews, bounded implementation, documentation reconciliation, validation, two specialized close-out reviews, and explicit delivery."
version = 1
type = "workflow"
phase = "liquid"
pour = true
intent = "documentation-first-feature"

[vars.feature_name]
description = "Human-readable feature name"
required = true

[vars.feature_slug]
description = "Lowercase filesystem-safe feature slug"
required = true
pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"

[vars.design_path]
description = "Canonical feature design path"
required = true

[vars.implemented_path]
description = "Delivered-feature documentation path"
required = true

[vars.base_branch]
description = "Git branch the feature worktree is based on"
default = "main"

[[steps]]
id = "design"
title = "Design: {{feature_name}}"
type = "task"
priority = 1
labels = ["workflow:feature-lifecycle", "phase:design"]
metadata = { workflow_phase = "design" }
description = """
Run the interactive planning and design-question loop. Create or update {{design_path}}. Preserve concrete user intent, boundaries, proposed design, documentation impact, validation strategy, risks, rejected alternatives, and open decisions. Decompose implementation into bounded Beads child tasks beneath the implementation coordinator and add only real blocker dependencies.
"""

[[steps]]
id = "review-specification-clarity"
title = "Review specification clarity: {{feature_name}}"
type = "task"
priority = 1
labels = [
  "workflow:feature-lifecycle",
  "phase:spec-review",
  "review:specification-clarity"
]
needs = ["design"]
metadata = { workflow_phase = "spec-review", review_kind = "specification-clarity" }
description = """
Review {{design_path}} for behavior, boundaries, compatibility, ownership, failure and recovery policy, documentation intent, and unresolved decisions. Use a direct Beads-derived assignment and pinned Git source boundary. Record executable review state and findings without inventing user policy.
"""

[[steps]]
id = "review-execution-readiness"
title = "Review execution readiness: {{feature_name}}"
type = "task"
priority = 1
labels = [
  "workflow:feature-lifecycle",
  "phase:spec-review",
  "review:execution-readiness"
]
needs = ["design"]
metadata = { workflow_phase = "spec-review", review_kind = "execution-readiness" }
description = """
Review implementation children for scope, dependencies, ownership, validation, documentation ownership, acceptance criteria, and commit boundaries. Use a direct Beads-derived assignment and pinned Git source boundary. Each child must be independently understandable and executable without inventing intent.
"""

[[steps]]
id = "spec-reconcile"
title = "Reconcile specification: {{feature_name}}"
type = "task"
priority = 1
labels = ["workflow:feature-lifecycle", "phase:spec-ready"]
needs = ["review-specification-clarity", "review-execution-readiness"]
metadata = { workflow_phase = "spec-ready" }
description = """
Reconcile review findings into {{design_path}} and the Beads implementation graph. Resolve clear findings directly. Ask the user one blocking design question at a time when policy or intent is genuinely ambiguous. Commit the reviewed design and record the commit SHA before closing this step.
"""

[[steps]]
id = "implementation"
title = "Implement: {{feature_name}}"
type = "task"
priority = 1
labels = ["workflow:feature-lifecycle", "phase:implementation"]
needs = ["spec-reconcile"]
metadata = { workflow_phase = "implementation" }
description = """
Coordinator for bounded implementation child beads created during planning. Claim and complete children through bd ready. Keep code, tests, and assigned reader-facing documentation aligned. Close this coordinator after every required child is closed or explicitly deferred and delivered behavior satisfies {{design_path}}.
"""

[[steps]]
id = "docs-reconcile"
title = "Reconcile documentation: {{feature_name}}"
type = "task"
priority = 1
labels = [
  "workflow:feature-lifecycle",
  "phase:closeout",
  "closeout:documentation"
]
needs = ["implementation"]
metadata = { workflow_phase = "closeout", closeout_kind = "documentation" }
description = """
Compare delivered behavior with {{design_path}}, every page named in its Documentation Impact section, and every reader-facing page changed by implementation. Update current docs, docs/src/planned-features.md, docs/src/features/index.md, {{implemented_path}}, and docs/src/SUMMARY.md as applicable. The implemented-feature page preserves audit history without replacing product documentation.
"""

[[steps]]
id = "validate"
title = "Validate: {{feature_name}}"
type = "task"
priority = 1
labels = ["workflow:feature-lifecycle", "phase:closeout", "closeout:validation"]
needs = ["implementation"]
metadata = { workflow_phase = "closeout", closeout_kind = "validation" }
description = """
Run impacted feature validation, `uv run --no-project python scripts/check-docs.py`, and all feature-specific commands named by {{design_path}} or implementation beads. Record commands, results, limitations, and skipped checks in this bead.
"""

[[steps]]
id = "review-implementation"
title = "Review implementation integrity: {{feature_name}}"
type = "task"
priority = 1
labels = [
  "workflow:feature-lifecycle",
  "phase:closeout",
  "review:implementation-integrity"
]
needs = ["docs-reconcile", "validate"]
metadata = { workflow_phase = "closeout-review", review_kind = "implementation-integrity" }
description = """
Review correct code behavior, quality and simplicity, security, and maintainability within the pinned Git source boundary. Inspect implementation paths, tests, failure behavior, and security-sensitive changes. Do not review delivery documentation or Beads lifecycle status except where a code defect makes a claim unsafe. Use a direct controller-derived assignment and one bounded verification pass.
"""

[[steps]]
id = "review-delivery-integrity"
title = "Review delivery integrity: {{feature_name}}"
type = "task"
priority = 1
labels = [
  "workflow:feature-lifecycle",
  "phase:closeout",
  "review:delivery-integrity"
]
needs = ["docs-reconcile", "validate"]
metadata = { workflow_phase = "closeout-review", review_kind = "delivery-integrity" }
description = """
Review documentation, validation evidence, Beads state, the implemented record, roadmap/navigation, delivery claims, and cross-artifact drift within the pinned Git source boundary. Do not duplicate implementation-integrity review. Use a direct controller-derived assignment and one bounded verification pass.
"""

[[steps]]
id = "delivery"
title = "Deliver: {{feature_name}}"
type = "human"
priority = 1
labels = ["workflow:feature-lifecycle", "phase:delivery"]
needs = ["review-implementation", "review-delivery-integrity"]
metadata = { workflow_phase = "delivery" }
description = """
The feature is reconciled and validated. Ask for one explicit action: create a pull request, merge, or leave ready with no delivery action. Record the chosen action, PR URL or merge commit when applicable. Close the feature root only when its actual delivery state and documentation are final.
"""
