formula = "dstack-feature"
description = """
Beads-native feature workflow for dStack.

Beads owns every durable workflow transition. The molecule records planning,
independent plan review, human approval, implementation work, and final close.
dStack supplies only deterministic repository mechanics and validators.
"""
version = 3
type = "workflow"
phase = "liquid"
pour = true

[vars.title]
description = "Feature title used for the molecule root"
required = true

[vars.desc]
description = "Initial feature request or problem statement"
required = true

[vars.feature_title]
description = "Human-readable feature title"
required = true

[vars.feature_slug]
description = "Kebab-case feature identifier"
required = true
pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"

[vars.base_branch]
description = "Git branch from which feature work is based"
required = true

[[steps]]
id = "plan"
title = "Plan {{feature_title}}"
type = "task"
priority = 1
labels = ["dstack:step:plan"]
description = """
Record the original request, desired behavior, constraints, non-goals, focused
questions and answers, a publishable design, and observable acceptance criteria.
Planning stays focused on user intent rather than broad repository investigation.

Feature slug: {{feature_slug}}
Base branch: {{base_branch}}
"""

[[steps]]
id = "review"
title = "Review the plan and create implementation work for {{feature_title}}"
type = "task"
priority = 1
needs = ["plan"]
labels = ["dstack:step:review"]
description = """
Search targeted project memories, then reconcile the completed plan against only
the relevant current code, tests, documentation, and accepted decisions. Resolve
clear defects, ask the user when authority is ambiguous, create bounded native
implementation tasks with explicit dependencies, and validate the complete graph
before requesting approval.
"""

[[steps]]
id = "approval"
title = "Approve the reviewed plan for {{feature_title}}"
type = "task"
priority = 1
needs = ["review"]
labels = ["dstack:step:approval"]
description = """
Human approval boundary for the reviewed plan and implementation graph. Resolve
the generated human gate only after the user explicitly approves the reviewed
scope. Close this milestone to expose approved implementation work through the
native Beads ready queue.
"""

[steps.gate]
type = "human"
id = "approve-{{feature_slug}}-plan"

[[steps]]
id = "implementation"
title = "Implementation work for {{feature_title}}"
type = "epic"
priority = 1
labels = ["dstack:step:implementation"]
description = """
Structural container for reviewed implementation tasks. Beads 1.2.2 rejects
blocking dependencies between task and epic issue types, so this epic has no
approval dependency. Each native child task is created atomically with a blocker
on the task-shaped approval milestone and owns one bounded accepted outcome.
Native waits-for
fan-in on the final close step is the sole implementation-completion dependency.
"""

[[steps]]
id = "audit"
title = "Close {{feature_title}}"
type = "task"
priority = 1
needs = ["approval"]
waits_for = "children-of(implementation)"
labels = ["dstack:step:audit"]
description = """
Review approved intent, decisions, implementation tasks, commits, tests, and
current code before feature documentation is written. Reopen the owning task for
clear defects, create a child task only when no task owns the finding, and ask
the user through a native gate when authority is ambiguous. Materialize and
validate feature documentation only after review passes, then close the feature.
"""
