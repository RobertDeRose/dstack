name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: false
          install: false
      - env:
          MISE_IGNORED_CONFIG_PATHS: /home/runner/.config/mise/config.toml
        run: mise install --locked
      - run: uv run --frozen --group test pytest -m "not integration and not external" --durations=10
  integration:
    name: Integration / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: copier
            path: tests/test_repository.py
          - suite: migration
            path: tests/test_migrate_legacy_workflow.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-suffix: ${{ matrix.suite }}
          python-version: "3.13"
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: false
          install: false
      - env:
          MISE_IGNORED_CONFIG_PATHS: /home/runner/.config/mise/config.toml
        run: mise install --locked
      - run: uv run --frozen --group test pytest "${{ matrix.path }}" -m integration --durations=10
