name: external-validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    tags:
      - "v*"

permissions:
  attestations: read
  contents: read

jobs:
  skills-cli:
    name: Skills CLI discovery
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        # zizmor: ignore[cache-poisoning] External validation intentionally uses shared caches.
        with:
          enable-cache: true
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        # zizmor: ignore[cache-poisoning] External validation intentionally uses shared caches.
        with:
          node-version: 24

      - name: Set up mise and install locked tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        # zizmor: ignore[cache-poisoning] External validation intentionally uses shared caches.

      - run: uv run --frozen --group test pytest -m external --durations=10
