name: external-validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    tags:
      - "v*"

permissions:
  attestations: read
  contents: read

jobs:
  skills-cli:
    name: Skills CLI discovery
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        # zizmor: ignore[cache-poisoning] External validation intentionally uses shared caches.
        with:
          enable-cache: true
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        # zizmor: ignore[cache-poisoning] External validation intentionally uses shared caches.
        with:
          node-version: 24

      - name: Set up mise and install locked tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        # zizmor: ignore[cache-poisoning] External validation intentionally uses shared caches.

      - run: uv run --frozen --group test pytest -m external --durations=10
