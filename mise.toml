[tools]
"aqua:gastownhall/beads" = "1.2.2"
"aqua:owenlamont/ryl" = "latest"
"aqua:rust-lang/mdBook" = "latest"
actionlint = "latest"
hk = "latest"
jq = "latest"
pkl = "latest"
ruff = "latest"
rumdl = "latest"
tombi = "latest"
ty = "latest"
uv = "latest"
yamlfmt = "latest"

[tasks."docs:build"]
description = "Build the documentation site"
run = "mdbook build docs"

[tasks."docs:serve"]
description = "Serve the documentation site locally"
usage = 'arg "[port]" help="Port to serve on" default="3000"'
run = 'mdbook serve docs --port "${usage_port:-3000}"'
