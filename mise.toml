[tools]
"aqua:gastownhall/beads" = "1.2.2"
"aqua:owenlamont/ryl" = "latest"
"aqua:rust-lang/mdBook" = "0.5.4"
actionlint = "latest"
hk = "latest"
jq = "latest"
pkl = "latest"
"python" = "3.14.7"
ruff = "latest"
rumdl = "latest"
shellcheck = "latest"
tombi = "latest"
ty = "latest"
uv = "latest"
yamlfmt = "latest"

[tasks."docs:build"]
description = "Build the documentation site"
run = "mdbook build docs"

[tasks."docs:serve"]
description = "Serve the documentation site locally"
usage = 'arg "[port]" help="Port to serve on" default="3000"'
run = 'mdbook serve docs --port "${usage_port:-3000}"'

[tasks."release-check"]
description = "Build and verify release artifacts from a clean clone"
run = "./scripts/release-check.sh"
