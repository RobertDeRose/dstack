[project]
name = "dstack"
version = "0.5.0"
description = "Beads-native software engineering workflow controller for Pi"
requires-python = ">=3.14,<3.15"

[project.scripts]
dstack = "dstack.cli:main"

[dependency-groups]
dev = [
  "PyYAML>=6",
  "pytest>=8",
  "pytest-cov>=7",
  "types-PyYAML>=6",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/fast"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/fast/*.py" = ["E402"]

[tool.setuptools.packages.find]
include = ["dstack*"]

[tool.setuptools.package-data]
dstack = [
  "assets/APPEND_SYSTEM.md",
  "assets/formulas/*.toml",
  "assets/prompts/*.md",
  "assets/skills/*/*.md",
]
