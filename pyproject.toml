[project]
name = "dstack"
version = "0.6.0"
description = "Deterministic repository control plane for Beads-native agent workflows"
requires-python = ">=3.14,<3.15"
dependencies = [
  "rich>=15.0.0",
]

[project.scripts]
dstack = "dstack.cli:main"

[dependency-groups]
dev = [
  "PyYAML>=6",
  "pytest>=8",
  "pytest-cov>=7",
  "pytest-xdist>=3",
  "types-PyYAML>=6",
]

[tool.pytest.ini_options]
addopts = "-ra -n auto --dist loadscope -v"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/fast/*.py" = ["E402"]

[tool.setuptools.packages.find]
include = ["dstack*"]

[tool.setuptools.package-data]
dstack = [
  "assets/PRIME.md",
  "assets/formulas/*.toml",
  "assets/prompts/*.md",
  "assets/skills/*/*.md",
]
