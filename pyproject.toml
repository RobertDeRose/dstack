[project]
name = "dstack"
version = "0.5.0"
requires-python = ">=3.14"

[dependency-groups]
dev = [
  "PyYAML>=6",
  "pytest>=8",
  "pytest-cov>=7",
  "types-PyYAML>=6",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/fast"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/fast/*.py" = ["E402"]
"skills/dstack-beads-core/scripts/dstackctl.py" = ["F401"]
