# rumdl configuration - Google developer documentation style
# Based on https://google.github.io/styleguide/docguide/style.html

[global]
disable = ["MD033", "MD036"]
exclude = [
  "**/assets/pi-reviewers/*.md",
  ".git",
  ".github",
  "build",
  "AGENTS.md",
  "CHANGELOG.md",
  "dist",
  "LICENSE.md",
  "node_modules",
  "vendor",
]
flavor = "gfm"
respect-gitignore = true

# ATX-style headings required
[MD003]
style = "atx"

# Unordered list style: dash
[MD004]
style = "dash"

# 2-space indent for nested lists
[MD007]
indent = 2

[MD013]
line-length = 120
code-blocks = false
tables = false
reflow = true
reflow-mode = "normalize"

# No trailing punctuation in headings
[MD026]
punctuation = ".,;:!。，；：！"

# Fenced code blocks only (no indented code blocks)
[MD046]
style = "fenced"

# Emphasis with underscores
[MD049]
style = "underscore"

# Strong with asterisks
[MD050]
style = "asterisk"
