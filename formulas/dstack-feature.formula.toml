formula = "dstack-feature"
description = """
Persistent feature-delivery workflow for dstack.

The poured molecule contains only the stable lifecycle skeleton. Real
implementation work is created dynamically beneath the implementation epic.
The implementation gate records specification approval, while closeout uses
native dynamic fan-in over the implementation children.
"""
version = 1
type = "workflow"
phase = "liquid"
pour = true

[vars.feature_title]
description = "Human-readable feature title"
required = true

[vars.feature_slug]
description = "Kebab-case feature identifier"
required = true
pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"

[vars.base_branch]
description = "Integration branch from which the feature starts"
default = "dev"

[vars.design_path]
description = "Repository-relative feature design document"
required = true

[[steps]]
id = "specification"
title = "Review feature specification: {{feature_title}}"
type = "task"
priority = 1
labels = ["dstack:step:specification", "feature:{{feature_slug}}"]
metadata = { dstack_step = "specification", design_path = "{{design_path}}", base_branch = "{{base_branch}}" }
description = """
Review and reconcile {{design_path}} and the proposed implementation graph.
Resolve genuine product or architecture decisions, commit the accepted
specification, record its Git commit on this Bead, and close this step only
when implementation may proceed from that boundary.
"""

[[steps]]
id = "implementation"
title = "Implementation workstream: {{feature_title}}"
type = "epic"
priority = 1
needs = ["specification"]
labels = ["dstack:step:implementation", "feature:{{feature_slug}}"]
metadata = { dstack_step = "implementation", design_path = "{{design_path}}", base_branch = "{{base_branch}}" }
description = """
Container for the feature's real implementation tasks. Add bounded tasks as
children of this epic. Each task must also depend on the specification step
and wait on this workstream's human approval gate. Close this epic only after
all required implementation children are complete or explicitly deferred.
"""

[steps.gate]
type = "human"
id = "approve-{{feature_slug}}-specification"

[[steps]]
id = "closeout"
title = "Reconcile and close feature: {{feature_title}}"
type = "task"
priority = 1
needs = ["implementation"]
waits_for = "children-of(implementation)"
labels = ["dstack:step:closeout", "feature:{{feature_slug}}"]
metadata = { dstack_step = "closeout", design_path = "{{design_path}}", base_branch = "{{base_branch}}" }
description = """
Reconcile delivered behavior, reader documentation, validation evidence, and
remaining findings. Produce the final candidate and review it. Closing this
step makes the feature delivery-ready; the molecule root remains open until
the requested PR or fast-forward delivery actually completes.
"""
