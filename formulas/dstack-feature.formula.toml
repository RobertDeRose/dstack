formula = "dstack-feature"
description = """
Persistent feature-delivery workflow for dstack.

The poured molecule contains only the stable lifecycle skeleton. A task-sized
approval milestone carries the human gate because Beads blocking dependencies
must connect like kinds: tasks block tasks and epics block epics. Real
implementation work is created dynamically beneath the implementation epic and
depends on the approved milestone. Closeout uses native dynamic fan-in over the
implementation children.
"""
version = 7
type = "workflow"
phase = "liquid"
pour = true

[vars.feature_title]
description = "Human-readable feature title"
required = true

[vars.feature_slug]
description = "Kebab-case feature identifier"
required = true
pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"

[vars.design_path]
description = "Repository-relative feature design document"
required = true

[[steps]]
id = "specification"
title = "Review feature specification: {{feature_title}}"
type = "task"
priority = 1
labels = ["dstack:step:specification"]
description = """
Review and reconcile {{design_path}} and the proposed implementation graph.
Resolve genuine product or architecture decisions. Commit only when repository
content changes; approval is recorded as a digest of the accepted design content.
"""

[[steps]]
id = "approval"
title = "Authorize feature implementation: {{feature_title}}"
type = "task"
priority = 1
needs = ["specification"]
labels = ["dstack:step:implementation-approval"]
description = """
Human authorization milestone for implementation. The formula-generated gate
blocks this task. After the accepted specification is approved,
/review-feature-spec resolves the gate and closes this milestone. Dynamic
implementation tasks depend on this task rather than depending directly on a
gate or on the implementation epic.
"""

[steps.gate]
type = "human"
id = "approve-{{feature_slug}}-specification"

[[steps]]
id = "implementation"
title = "Implementation workstream: {{feature_title}}"
type = "epic"
priority = 1
labels = ["dstack:step:implementation"]
description = """
Container for the feature's real implementation tasks. Add bounded tasks as
children of this epic. Each task must depend on the implementation-approval
milestone. Close this epic only after all required implementation children are
complete or explicitly deferred.
"""

[[steps]]
id = "closeout"
title = "Reconcile and close feature: {{feature_title}}"
type = "task"
priority = 1
needs = ["approval"]
waits_for = "children-of(implementation)"
labels = ["dstack:step:closeout"]
description = """
Reconcile delivered behavior, reader documentation, validation evidence, and
remaining findings. Produce and review the final candidate. Closing this step
makes the feature eligible for delivery; the molecule root remains open until the
requested PR or fast-forward delivery actually completes.
"""
