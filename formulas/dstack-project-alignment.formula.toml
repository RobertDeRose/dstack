formula = "dstack-project-alignment"
description = """
Persistent three-tier project-alignment workflow for dstack.

Tier 1 analyzes and builds a corrective plan. A task-sized approval milestone
carries the native human gate because Beads blocking dependencies must connect
like kinds. Corrective tasks are created dynamically beneath the corrections
epic and depend on that approved milestone. Tier 3 uses native dynamic fan-in
and performs final reconciliation and delivery.
"""
version = 4
type = "workflow"
phase = "liquid"
pour = true

[vars.audit_title]
description = "Human-readable audit title"
required = true

[vars.audit_slug]
description = "Kebab-case audit identifier"
required = true
pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"

[vars.target_branch]
description = "Branch that the completed audit will land into"
default = "dev"

[vars.baseline_commit]
description = "Immutable Git commit audited during Tier 1"
required = true

[vars.scope]
description = "Human-readable audit scope"
default = "whole repository"

[[steps]]
id = "analysis"
title = "Analyze project alignment: {{audit_title}}"
type = "task"
priority = 1
labels = ["dstack:step:alignment-analysis"]
metadata = { dstack_step = "alignment-analysis" }
description = """
Analyze {{scope}} at {{baseline_commit}}. Compare specifications, reader
documentation, implementation, tests, Beads work, and delivery evidence.
Create a bounded corrective plan beneath the corrections workstream without
modifying source.
"""

[[steps]]
id = "approval"
title = "Approve project-alignment execution: {{audit_title}}"
type = "task"
priority = 1
needs = ["analysis"]
labels = ["dstack:step:alignment-approval"]
metadata = { dstack_step = "alignment-approval" }
description = """
Human authorization milestone for Tier 2. The formula-generated gate blocks
this task. /project-alignment-execute resolves the gate and closes this
milestone after explicit approval. Dynamic corrective tasks depend on this
task rather than depending directly on a gate or on the corrections epic.
"""

[steps.gate]
type = "human"
id = "approve-{{audit_slug}}-execution"

[[steps]]
id = "corrections"
title = "Execute project-alignment corrections: {{audit_title}}"
type = "epic"
priority = 1
labels = ["dstack:step:alignment-corrections"]
metadata = { dstack_step = "alignment-corrections" }
description = """
Container for approved corrective work. Add each bounded correction as a child
and make it depend on the alignment-approval milestone. Close this epic only
after all required corrective children are complete or explicitly deferred.
"""

[[steps]]
id = "landing"
title = "Validate and land project alignment: {{audit_title}}"
type = "task"
priority = 1
needs = ["approval"]
waits_for = "children-of(corrections)"
labels = ["dstack:step:alignment-landing"]
metadata = { dstack_step = "alignment-landing" }
description = """
Perform final reconciliation, repository validation, integration review, and
the explicitly requested delivery action. Closing this step makes the audit
delivery-ready; the molecule root remains open until delivery actually
completes.
"""
